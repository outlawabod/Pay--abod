<title>Pay Pawan Meena — UPI</title>
<style>
:root{--paper:#F6F1E4;--paper-dark:#EFE7D3;--ink:#201F1D;--ink-soft:#5B564C;--indigo:#2E3A59;--line:#C9BFA6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 14px;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center}
.wrap{width:100%;max-width:430px}
.eyebrow{text-align:center;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px}
.card{background:#FFFDF8;border:1px solid var(--ink);box-shadow:6px 6px 0 var(--indigo);overflow:hidden}
.head{padding:25px 24px 20px;text-align:center;border-bottom:1px dashed var(--line)}
.label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
h1{margin:0 0 6px;font-size:29px}
.sub{font-size:14px;color:var(--ink-soft)}
.qr-section{padding:25px 24px 15px;text-align:center}
.qr-frame{display:inline-block;padding:10px;background:#fff;border:1px solid var(--ink);max-width:100%}
.qr-frame img{display:block;width:100%;max-width:330px;height:auto}
.upi{margin-top:16px;padding:12px;background:var(--paper-dark);border:1px solid var(--line);font-family:monospace;font-size:14px;word-break:break-all}
.actions{padding:16px 24px 28px}
.pay{width:100%;border:0;border-radius:4px;padding:15px;background:var(--indigo);color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer}
.copy{width:100%;margin-top:10px;padding:11px;background:#fff;border:1px solid var(--ink);font-family:monospace;cursor:pointer}
.hint{text-align:center;margin-top:11px;color:var(--ink-soft);font-size:11px;line-height:1.45}
</style>
</head>
