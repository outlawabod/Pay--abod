<div class="amount-zone">
      <label class="field-label" for="amount">Amount (optional)</label>
      <div class="amount-input-row">
        <span class="rupee">₹</span>
        <input type="number" id="amount" inputmode="decimal" min="0" placeholder="0.00">
      </div>
      <div class="note-field">
        <label class="field-label" for="note">Note (optional)</label>
        <input type="text" id="note" placeholder="What's this for?">
      </div>
    </div>

    <div class="actions">
      <a class="pay-btn" id="payBtn" href="#">Open in UPI app</a>
      <div class="hint">Or scan the QR above with any UPI app</div>
      <div class="hint" id="desktopHint" style="display:none;">Works on a phone with a UPI app installed — scan the QR instead on desktop</div>
    </div>
  </div>

  <div class="footer-note">Paytm · UPI · UPI Lite</div>
</div>

<div class="toast" id="toast">Copied UPI ID</div>

<script>
  const UPI_ID = "paytmqr5ob0gc@ptys";
  const PAYEE_NAME = "Pawan Meena";

  const qrDiv = document.getElementById('qrcode');
  const amountInput = document.getElementById('amount');
  const noteInput = document.getElementById('note');
  const payBtn = document.getElementById('payBtn');
  let qrObj = null;

  function buildUpiUri(){
    // Built to match the exact raw format encoded in the real Paytm QR
    // (literal @ and spaces, not percent-encoded) — some UPI apps fail
    // to parse a percent-encoded VPA and reject the payment.
    let uri = 'upi://pay?pa=' + UPI_ID + '&pn=' + PAYEE_NAME + '&cu=INR';
    const amt = amountInput.value.trim();
    if(amt && parseFloat(amt) > 0){
      uri += '&am=' + parseFloat(amt).toFixed(2);
    }
    const note = noteInput.value.trim().replace(/&/g, 'and');
    if(note){
      uri += '&tn=' + note;
    }
    return uri;
  }

  function renderQr(){
    qrDiv.innerHTML = '';
    qrObj = new QRCode(qrDiv, {
      text: buildUpiUri(),
      width: 200,
      height: 200,
      colorDark: '#201F1D',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  function updateAll(){
    renderQr();
    payBtn.setAttribute('href', buildUpiUri());
  }

  amountInput.addEventListener('input', updateAll);
  noteInput.addEventListener('input', updateAll);

  payBtn.addEventListener('click', function(e){
    e.preventDefault();
    const uri = buildUpiUri();
    if(isMobile){
      window.location.href = uri;
    } else {
      document.getElementById('desktopHint').style.display = 'block';
    }
  });

  updateAll();

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(UPI_ID);
    }catch(e){
      const t = document.createElement('textarea');
      t.value = UPI_ID;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
    }
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  });
</script>
</body>
</html>
